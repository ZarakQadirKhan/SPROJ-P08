name: Frontend E2E (Cypress)

on:
  push:
    branches: [main]
    paths:
      - 'P08-Agri/Prototype/code/frontend/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    paths:
      - 'P08-Agri/Prototype/code/frontend/**'
      - '.github/workflows/frontend-e2e.yml'

jobs:
  cypress:
    runs-on: ubuntu-latest
    env:
      BROWSER: none
      CI: true
    defaults:
      run:
        working-directory: P08-Agri/Prototype/code/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: P08-Agri/Prototype/code/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: P08-Agri/Prototype/code/frontend
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180000
          browser: chrome
