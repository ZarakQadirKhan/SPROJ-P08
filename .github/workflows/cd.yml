name: CD - Deploy SPROJ to OKE

on:
  workflow_run:
    workflows: ["CI-GHCR"]
    types:
      - completed

permissions:
  contents: read  # can read repository files (needed for checkout).
  packages: read  # can pull Docker images from GitHub Container Registry.

env:
  # Use lowercase to match CI push (CI uses tr '[:upper:]' '[:lower:]' for image names)
  GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  # k8s manifests path (match your repo layout: e.g. repo root k8s/ or Sprint-4 k8s)
  K8S_DIR: P08-Agri/Development/Sprint-4/k8s

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy when the triggering CI workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      #  Checkout the same commit that CI built (so image SHA matches)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      #  Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      # 3️⃣ Install OCI CLI via pip (pinned version to avoid "unexpected extra arguments" from install script version)
      - name: Install OCI CLI
        run: |
          python3 -m pip install --user 'oci-cli==3.37.2'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Verify OCI CLI on PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          which oci && oci --version

      # 4️⃣ Configure OCI (requires OCI_USER_OCID, OCI_TENANCY_OCID, OCI_REGION, OCI_PRIVATE_KEY; fingerprint is derived from the key).
      - name: Configure OCI
        run: |
          mkdir -p ~/.oci
          trim() { echo "$1" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }

          if [ -z "$(trim "${{ secrets.OCI_USER_OCID }}")" ]; then
            echo "::error::OCI_USER_OCID secret is missing or empty. Add it in GitHub Actions secrets (your user OCID, e.g. ocid1.user.oc1..aaaa...)."
            exit 1
          fi
          if [ -z "$(trim "${{ secrets.OCI_TENANCY_OCID }}")" ]; then
            echo "::error::OCI_TENANCY_OCID secret is missing or empty. Add it in GitHub Actions secrets."
            exit 1
          fi

          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          FINGERPRINT=$(openssl rsa -pubout -outform DER -in ~/.oci/oci_api_key.pem 2>/dev/null | openssl md5 -c 2>/dev/null | awk -F'= ' '{print $2}' | tr -d '\n\r')
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::Could not derive fingerprint from OCI_PRIVATE_KEY. Ensure the secret is the full PEM (-----BEGIN PRIVATE KEY----- ... -----END PRIVATE KEY-----) with newlines preserved; no extra text after END."
            exit 1
          fi

          USER_OCID=$(trim "${{ secrets.OCI_USER_OCID }}")
          TENANCY_OCID=$(trim "${{ secrets.OCI_TENANCY_OCID }}")
          REGION=$(trim "${{ secrets.OCI_REGION }}")

          {
            echo "[DEFAULT]"
            echo "user=$USER_OCID"
            echo "fingerprint=$FINGERPRINT"
            echo "tenancy=$TENANCY_OCID"
            echo "region=$REGION"
            echo "key_file=~/.oci/oci_api_key.pem"
          } > ~/.oci/config
          chmod 600 ~/.oci/config
          echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True" >> $GITHUB_ENV

      # 5️⃣ Generate kubeconfig for OKE (OKE_CLUSTER_OCID + OCI_REGION must match cluster region, e.g. ap-mumbai-1)
      - name: Get kubeconfig
        run: |
          if [ -z "${{ secrets.OKE_CLUSTER_OCID }}" ]; then
            echo "::error::OKE_CLUSTER_OCID is not set or is empty. Add it in GitHub: Settings → Secrets and variables → Actions. Value = your OKE cluster OCID (e.g. ocid1.cluster.oc1..uniqueid)."
            exit 1
          fi
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.kube"
          CFG="$HOME/.kube/config"
          oci --region "${{ secrets.OCI_REGION }}" ce cluster create-kubeconfig --cluster-id "${{ secrets.OKE_CLUSTER_OCID }}" --file "$CFG" --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT
          chmod 600 "$CFG"
      - name: Set KUBECONFIG environment
        run: echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      # 6️⃣ Verify cluster connectivity
      - name: Verify cluster connectivity
        run: |
          kubectl get nodes
          kubectl get namespaces

      # 7️⃣ Create namespace if not exists
      - name: Create namespace
        run: kubectl create namespace sproj-app || true

      # 8️⃣ Create app secret (JWT_SECRET) — fail fast if not set
      - name: Create app secret
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "::error::JWT_SECRET must be set in repository Secrets (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          kubectl create secret generic sproj-app-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -n sproj-app --dry-run=client -o yaml | kubectl apply -f -

      # 9️⃣ Create GHCR pull secret
      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ secrets.GHCR_USERNAME }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            -n sproj-app --dry-run=client -o yaml | kubectl apply -f -

      # 🔟 Apply MongoDB init ConfigMap
      - name: Apply MongoDB init ConfigMap
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/mongo-init-script.yaml -n sproj-app

      # 1️⃣1️⃣ Deploy MongoDB (longer timeout for first-time image pull from Docker Hub)
      - id: deploy-mongodb
        name: Deploy MongoDB
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/mongodb-deployment.yaml -n sproj-app
          kubectl apply -f ${{ env.K8S_DIR }}/mongodb-service.yaml -n sproj-app
          kubectl rollout status deployment/mongodb -n sproj-app --timeout=600s

      - name: Debug MongoDB pods (on failure)
        if: failure() && steps.deploy-mongodb.outcome == 'failure'
        run: |
          echo "=== MongoDB pods ==="
          kubectl get pods -l app=mongodb -n sproj-app -o wide || true
          echo "=== Pod description ==="
          kubectl describe pods -l app=mongodb -n sproj-app || true
          echo "=== Recent events in sproj-app ==="
          kubectl get events -n sproj-app --sort-by='.lastTimestamp' | tail -40 || true

      # 1️⃣2️⃣ Deploy Backend (use same SHA as CI so image tag matches)
      - name: Deploy Backend
        run: |
          IMAGE_PREFIX=$(echo "$GHCR_IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')
          IMAGE_SHA="${{ github.event.workflow_run.head_sha }}"
          kubectl apply -f ${{ env.K8S_DIR }}/backend-deployment.yaml -n sproj-app
          kubectl set image deployment/backend backend=${IMAGE_PREFIX}/backend:${IMAGE_SHA} -n sproj-app
          kubectl rollout status deployment/backend -n sproj-app --timeout=300s
          kubectl apply -f ${{ env.K8S_DIR }}/backend-service.yaml -n sproj-app

      # 1️⃣3️⃣ Deploy Frontend
      - name: Deploy Frontend
        run: |
          IMAGE_PREFIX=$(echo "$GHCR_IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')
          IMAGE_SHA="${{ github.event.workflow_run.head_sha }}"
          kubectl apply -f ${{ env.K8S_DIR }}/frontend-deployment.yaml -n sproj-app
          kubectl set image deployment/frontend frontend=${IMAGE_PREFIX}/frontend:${IMAGE_SHA} -n sproj-app
          kubectl rollout status deployment/frontend -n sproj-app --timeout=300s
          kubectl apply -f ${{ env.K8S_DIR }}/frontend-service.yaml -n sproj-app

      # 1️⃣4️⃣ Install NGINX Ingress Controller (if not exists)
      - name: Install NGINX Ingress Controller
        run: |
          kubectl get namespace ingress-nginx || \
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.1/deploy/static/provider/cloud/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      # 1️⃣5️⃣ Apply ingress
      - name: Apply ingress
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/ingress.yaml -n sproj-app
          kubectl get ingress -n sproj-app
